<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Member workspace — unassign & header, v1</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      canvas: "var(--canvas)", surface: "var(--surface)", "surface-soft": "var(--surface-soft)",
      ink: "var(--text)", "ink-2": "var(--text-secondary)", "ink-3": "var(--text-muted)",
      hair: "var(--border)", "hair-strong": "var(--border-strong)",
      accent: "var(--accent)", "accent-tint": "var(--accent-tint)", "accent-ink": "var(--accent-ink)",
      warm: "var(--warm)", "warm-tint": "var(--warm-tint)", "warm-ink": "var(--warm-ink)",
      ship: "var(--ship)", "ship-tint": "var(--ship-tint)", "ship-ink": "var(--ship-ink)",
      danger: "var(--danger)", "danger-tint": "var(--danger-tint)", "danger-ink": "var(--danger-ink)",
    },
    borderRadius: { chip: "6px", control: "9px", card: "14px", hero: "18px" },
    transitionDuration: { instant: "100ms", quick: "160ms", base: "220ms", ship: "420ms" },
  }}
};
</script>
<style>
  :root{
    --canvas:#fbf9f5; --surface:#fff; --surface-soft:#f3efe8;
    --text:#221f1a; --text-secondary:#6e6860; --text-muted:#a39c90;
    --border:#ebe6dc; --border-strong:#ded8cc;
    --accent:#5a43c9; --accent-tint:#ece9fb; --accent-ink:#45329b;
    --warm:#b9791a; --warm-tint:#f7ebd4; --warm-ink:#8a5a12;
    --ship:#2e7d46; --ship-tint:#e4f0e5; --ship-ink:#245e36;
    --danger:#c0392b; --danger-tint:#f8e7e4; --danger-ink:#8e2a1f;
  }
  body{background:var(--canvas);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .ease-out-lems{transition-timing-function:cubic-bezier(.2,.8,.2,1)}
  @keyframes paneIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .pane-in{animation:paneIn 220ms cubic-bezier(.2,.8,.2,1) both}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body class="p-6">

<div class="mx-auto max-w-[900px]">
  <!-- frame label for screenshots -->
  <p id="frameLabel" class="mb-3 text-[11px] uppercase tracking-wide text-ink-3">frame: default</p>

  <div class="flex flex-col gap-4">
    <!-- ============ HEADER ============ -->
    <div class="flex items-center gap-3">
      <a href="#" aria-label="Back to team"
         class="grid h-8 w-8 shrink-0 place-items-center rounded-control border border-hair text-ink-2 transition-colors duration-quick hover:bg-surface-soft">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </a>
      <span class="grid h-10 w-10 place-items-center rounded-full bg-accent-tint text-[15px] font-medium text-accent-ink">R</span>
      <div class="min-w-0 flex-1">
        <h1 class="text-[18px] font-medium text-ink">Rahul&rsquo;s work</h1>
        <p class="text-[12px] text-ink-3"><span id="hShipped">3</span> shipped &middot; <span id="hActive">5</span> active</p>
      </div>
      <!-- shipped meter replaces the removed Assign button -->
      <div id="meter" class="hidden shrink-0 items-center gap-2 sm:flex" role="img" aria-label="3 of 8 assigned items shipped">
        <div class="h-1.5 w-24 overflow-hidden rounded-full bg-surface-soft">
          <div id="meterFill" class="h-full rounded-full bg-ship transition-[width] duration-base ease-out-lems" style="width:38%"></div>
        </div>
        <span id="meterPct" class="text-[11px] tabular-nums text-ink-3">38%</span>
      </div>
    </div>

    <div class="grid gap-4 md:grid-cols-[300px_1fr] md:items-start">
      <!-- ============ LEFT: LIST ============ -->
      <div class="flex flex-col gap-4">
        <section>
          <p class="mb-2 text-[11px] text-ink-3">Active &middot; <span id="sActive">5</span></p>
          <div id="activeWrap" class="overflow-hidden rounded-card border border-hair bg-surface"></div>
          <p id="activeEmpty" class="hidden rounded-card border border-dashed border-hair px-3 py-3 text-[12px] text-ink-3">Nothing active.</p>
        </section>
        <section>
          <p class="mb-2 text-[11px] text-ink-3">Completed &middot; <span id="sDone">3</span></p>
          <div id="doneWrap" class="overflow-hidden rounded-card border border-hair bg-surface"></div>
        </section>
      </div>

      <!-- ============ RIGHT: DETAIL ============ -->
      <div id="pane" tabindex="-1" class="rounded-card border border-hair bg-surface p-4 outline-none">
        <!-- filled by JS -->
      </div>
    </div>
  </div>

  <!-- prototype controls -->
  <div class="mt-8 flex flex-wrap gap-2 border-t border-hair pt-4 text-[12px]">
    <button onclick="setFrame('default')" class="rounded-control border border-hair px-3 py-1.5">Default</button>
    <button onclick="setFrame('rowhover')" class="rounded-control border border-hair px-3 py-1.5">Row hover</button>
    <button onclick="setFrame('btnhover')" class="rounded-control border border-hair px-3 py-1.5">Unassign hover</button>
    <button onclick="setFrame('confirmActive')" class="rounded-control border border-hair px-3 py-1.5">Confirm (active)</button>
    <button onclick="setFrame('confirmDone')" class="rounded-control border border-hair px-3 py-1.5">Confirm (shipped)</button>
    <button onclick="setFrame('removing')" class="rounded-control border border-hair px-3 py-1.5">Mid-removal</button>
    <button onclick="setFrame('notice')" class="rounded-control border border-hair px-3 py-1.5">After removal</button>
    <button onclick="setFrame('emptyNone')" class="rounded-control border border-hair px-3 py-1.5">Empty (no tasks)</button>
    <button onclick="setFrame('emptyUnselected')" class="rounded-control border border-hair px-3 py-1.5">Empty (nothing selected)</button>
  </div>
</div>

<!-- ============ CONFIRM DIALOG ============ -->
<div id="scrim" class="fixed inset-0 z-50 hidden place-items-center bg-black/25 p-4">
  <div id="dialog" class="w-full max-w-sm rounded-card border border-hair bg-surface p-5 shadow-xl">
    <h3 id="dTitle" class="text-[15px] font-medium text-ink">Unassign from Rahul</h3>
    <div id="dBody" class="mt-2 text-[13px] leading-relaxed text-ink-2"></div>
    <div class="mt-4 flex justify-end gap-2">
      <button onclick="closeDialog()" class="rounded-control border border-hair px-4 py-2 text-[13px] text-ink-2 hover:bg-surface-soft">Cancel</button>
      <button id="dConfirm" onclick="doRemove()" class="rounded-control bg-danger px-4 py-2 text-[13px] font-medium text-white transition-transform duration-quick active:scale-[0.98]">Unassign</button>
    </div>
  </div>
</div>

<script>
const I = {
  circle:'<svg class="h-[18px] w-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/></svg>',
  folder:'<svg class="h-[18px] w-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>',
  moon:'<svg class="h-[18px] w-[18px] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
  check:'<svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  note:'<svg class="h-3 w-3 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v5h5"/></svg>',
  userMinus:(c)=>`<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 11h-6"/></svg>`,
  library:'<svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>',
};

let tasks = [
  {id:'t1', title:'Alex Hormozi — $100M Offers (playlist)', state:'open', deadline:'2026-07-20', note:true},
  {id:'t2', title:'Meta Ads: campaign structure deep-dive', state:'open', deadline:'2026-08-04', note:false},
  {id:'t3', title:'Cold email teardown — 12 examples', state:'open', deadline:null, note:true, folder:true},
  {id:'t4', title:'Copywriting fundamentals', state:'parked', deadline:null, note:false},
  {id:'t5', title:'SEO: topical authority explainer', state:'open', deadline:'2026-08-11', note:false},
  {id:'d1', title:'Ogilvy on Advertising (book)', state:'complete', note:true},
  {id:'d2', title:'Positioning — April Dunford talk', state:'complete', note:false},
  {id:'d3', title:'GA4 setup walkthrough', state:'complete', note:true},
];
let selectedId = 't1';
let removingId = null;
let notice = null;
let forceHoverRow = null, forceHoverBtn = null;
const MEMBER = 'Rahul';

function dueLabel(d){
  if(!d) return null;
  const dt = new Date(d), overdue = dt < new Date('2026-07-28');
  const txt = dt.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return {text: overdue ? 'overdue · '+txt : 'due '+txt, overdue};
}

function taskIcon(t, sel){
  if(t.state==='complete') return `<span class="grid h-[18px] w-[18px] shrink-0 place-items-center rounded-full bg-ship-tint text-ship-ink">${I.check}</span>`;
  if(t.folder) return `<span class="text-accent-ink">${I.folder}</span>`;
  if(t.state==='parked') return `<span class="text-ink-3">${I.moon}</span>`;
  return `<span class="${sel?'text-accent-ink':'text-ink-3'}">${I.circle}</span>`;
}

function rowHTML(t){
  const sel = t.id===selectedId;
  const due = t.state!=='complete' ? dueLabel(t.deadline) : null;
  const removing = t.id===removingId;
  const canUnassign = t.state!=='complete';
  const hoverForced = forceHoverRow===t.id;
  const btnHoverForced = forceHoverBtn===t.id;

  const unassignBtn = canUnassign ? `
    <button type="button" onclick="event.stopPropagation();openDialog('${t.id}')"
      aria-label="Unassign &quot;${t.title}&quot; from ${MEMBER}"
      data-unassign="${t.id}"
      class="ml-1.5 grid h-9 w-9 shrink-0 place-items-center rounded-chip text-ink-3 transition duration-quick ease-out-lems
             hover:!bg-danger-tint hover:!text-danger-ink
             focus-visible:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-danger focus-visible:ring-offset-1 focus-visible:ring-offset-surface
             md:absolute md:right-1.5 md:top-1/2 md:ml-0 md:h-7 md:w-7 md:-translate-y-1/2 md:opacity-0
             ${sel?'md:bg-accent-tint':'md:bg-surface-soft'}
             md:group-hover:opacity-100 md:group-focus-within:opacity-100
             ${hoverForced||btnHoverForced?'!opacity-100':''} ${btnHoverForced?'!bg-danger-tint !text-danger-ink':''}">
      ${I.userMinus('h-3.5 w-3.5')}
    </button>` : '';

  return `
  <div data-row-wrap="${t.id}" class="grid transition-all duration-base ease-in-out ${removing?'grid-rows-[0fr] opacity-0':'grid-rows-[1fr] opacity-100'}">
   <div class="overflow-hidden">
    <div class="group relative flex w-full items-center border-b border-hair pr-2 last:border-b-0 transition-colors duration-quick ${sel?'bg-accent-tint':(hoverForced?'bg-surface-soft':'hover:bg-surface-soft')}">
      <button type="button" data-task-row="${t.id}" onclick="select('${t.id}')" aria-current="${sel}"
        class="flex min-w-0 flex-1 items-center gap-2 py-2.5 text-left outline-none focus-visible:bg-surface-soft">
        <span aria-hidden="true" class="h-9 w-[3px] shrink-0 rounded-r ${sel?'bg-accent':'bg-transparent'}"></span>
        ${taskIcon(t,sel)}
        <span class="min-w-0 flex-1 truncate text-[12px] ${sel?'font-medium text-accent-ink':(t.state==='complete'?'text-ink-2':'text-ink')}">${t.title}</span>
        ${t.note?`<span class="text-ink-3">${I.note}</span>`:''}
        ${due?`<span class="shrink-0 text-[10px] transition-opacity duration-quick ${due.overdue?'text-warm-ink':'text-ink-3'} md:group-hover:opacity-0 md:group-focus-within:opacity-0 ${hoverForced||btnHoverForced?'md:opacity-0':''}">${due.text}</span>`:''}
      </button>
      ${unassignBtn}
      ${!canUnassign?'<span class="w-2"></span>':''}
    </div>
   </div>
  </div>`;
}

function paneHTML(){
  const t = tasks.find(x=>x.id===selectedId);
  if(!t){
    if(notice){
      return `<div class="pane-in grid min-h-[220px] place-items-center px-4 text-center">
        <div role="status" aria-live="polite">
          <p class="text-[13px] text-ink-2">Unassigned &ldquo;<span class="font-medium text-ink">${notice}</span>&rdquo;.</p>
          <p class="mx-auto mt-1 max-w-xs text-[12px] text-ink-3">It&rsquo;s still in the Library — assign it again any time.</p>
        </div>
      </div>`;
    }
    if(tasks.length===0){
      return `<div class="grid min-h-[220px] place-items-center px-4 text-center">
        <div>
          <p class="text-[14px] font-medium text-ink">${MEMBER} has nothing assigned yet</p>
          <p class="mx-auto mt-1 max-w-[15rem] text-[12px] text-ink-2">Work is handed out from the Library — open a resource there and send it to ${MEMBER}.</p>
          <a href="#" class="mt-3 inline-flex items-center gap-1.5 rounded-control border border-hair px-3 py-1.5 text-[12px] font-medium text-ink-2 transition-colors duration-quick hover:border-hair-strong hover:bg-surface-soft">
            ${I.library} Open the Library
          </a>
        </div>
      </div>`;
    }
    return `<div class="pane-in grid min-h-[220px] place-items-center px-4 text-center">
      <p class="max-w-[16rem] text-[13px] text-ink-3">Pick something on the left to read ${MEMBER}&rsquo;s notes and leave a comment.</p>
    </div>`;
  }

  const due = dueLabel(t.deadline);
  const chip = t.state==='complete'
    ? `<span class="rounded-chip bg-ship-tint px-2 py-0.5 text-[11px] text-ship-ink">Done</span>`
    : t.state==='parked'
      ? `<span class="rounded-chip border border-hair bg-surface px-2 py-0.5 text-[11px] text-ink-2">Parked</span>`
      : due ? `<span class="rounded-chip px-2 py-0.5 text-[11px] ${due.overdue?'bg-warm-tint text-warm-ink':'bg-surface-soft text-ink-2'}">${due.text}</span>` : '';

  const btnHoverForced = forceHoverBtn==='pane';
  return `
  <div class="flex flex-col gap-4 transition-all duration-quick ${removingId===t.id?'translate-y-[2px] opacity-0':'translate-y-0 opacity-100'}">
    <div>
      <div class="mb-2 flex items-center gap-2">
        <div class="flex min-w-0 flex-1 flex-wrap items-center gap-2">${chip}</div>
        <button type="button" onclick="openDialog('${t.id}')"
          aria-label="Unassign &quot;${t.title}&quot; from ${MEMBER}"
          class="inline-flex shrink-0 items-center gap-1.5 rounded-control border border-hair px-2.5 py-1.5 text-[11px] font-medium text-ink-2 transition-colors duration-quick
                 hover:border-danger hover:bg-danger-tint hover:text-danger-ink
                 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-danger focus-visible:ring-offset-2 focus-visible:ring-offset-surface
                 active:scale-[0.98] ${btnHoverForced?'border-danger bg-danger-tint text-danger-ink':''}">
          ${I.userMinus('h-3.5 w-3.5')} Unassign
        </button>
      </div>
      <h2 class="text-[16px] font-medium text-ink">${t.title}</h2>
    </div>

    <div>
      <p class="mb-1.5 flex items-center gap-1.5 text-[11px] text-ink-3">${I.note} ${MEMBER}&rsquo;s notes</p>
      ${t.note
        ? `<p class="whitespace-pre-wrap rounded-control bg-surface-soft px-3 py-2.5 text-[13px] leading-relaxed text-ink">Offer stack &gt; discounting. Rewrite our onboarding pitch around the value equation — dream outcome / likelihood / time / effort.</p>`
        : `<p class="rounded-control border border-dashed border-hair px-3 py-2.5 text-[12px] text-ink-3">No notes added yet.</p>`}
    </div>

    <div>
      <p class="mb-1.5 text-[11px] text-ink-3">Comments</p>
      <div class="flex flex-col gap-2">
        <div class="rounded-control bg-surface-soft px-3 py-2">
          <p class="text-[12px] text-ink">Great pull-out. Can you turn this into a one-pager?</p>
          <p class="mt-0.5 text-[10px] text-ink-3">Nand · 22 Jul</p>
        </div>
      </div>
      <div class="mt-2 flex items-center gap-2">
        <input placeholder="Add a comment…" class="flex-1 rounded-control border border-hair bg-surface px-3 py-2 text-[13px] text-ink outline-none focus:border-accent" />
        <button class="grid h-9 w-9 shrink-0 place-items-center rounded-control bg-accent text-white">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>
    </div>

    <div class="border-t border-hair pt-3">
      <p class="mb-1.5 flex items-center gap-1.5 text-[11px] text-ink-3">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
        Send ${MEMBER} a nudge
      </p>
      <div class="flex items-center gap-2">
        <input placeholder='e.g. Any update on this?' class="flex-1 rounded-control border border-hair bg-surface px-3 py-2 text-[13px] text-ink outline-none focus:border-accent" />
        <button class="inline-flex shrink-0 items-center gap-1.5 rounded-control bg-accent px-3 py-2 text-[12px] font-medium text-white">Send</button>
      </div>
    </div>
  </div>`;
}

function render(){
  const active = tasks.filter(t=>t.state!=='complete');
  const done = tasks.filter(t=>t.state==='complete');
  document.getElementById('activeWrap').innerHTML = active.map(rowHTML).join('');
  document.getElementById('activeWrap').classList.toggle('hidden', active.length===0);
  document.getElementById('activeEmpty').classList.toggle('hidden', active.length!==0);
  document.getElementById('doneWrap').innerHTML = done.map(rowHTML).join('');
  document.getElementById('doneWrap').classList.toggle('hidden', done.length===0);
  document.getElementById('pane').innerHTML = paneHTML();
  document.getElementById('sActive').textContent = active.length;
  document.getElementById('sDone').textContent = done.length;
  document.getElementById('hActive').textContent = active.length;
  document.getElementById('hShipped').textContent = done.length;
  const pct = tasks.length ? Math.round(done.length/tasks.length*100) : 0;
  document.getElementById('meterFill').style.width = pct+'%';
  document.getElementById('meterPct').textContent = pct+'%';
  document.getElementById('meter').classList.toggle('hidden', tasks.length===0);
  document.getElementById('meter').setAttribute('aria-label', `${done.length} of ${tasks.length} assigned items shipped`);
}

function select(id){ selectedId=id; notice=null; render(); }

let pendingId=null;
function openDialog(id){
  pendingId=id;
  const t = tasks.find(x=>x.id===id);
  const doneCount = tasks.filter(x=>x.state==='complete').length;
  const scrim=document.getElementById('scrim');
  scrim.classList.remove('hidden'); scrim.classList.add('grid');
  if(t.state==='complete'){
    document.getElementById('dTitle').textContent = 'Unassign shipped work?';
    document.getElementById('dBody').innerHTML =
      `<span class="font-medium text-ink">&ldquo;${t.title}&rdquo;</span> is already shipped. Unassigning takes it off ${MEMBER}&rsquo;s record — their shipped count drops from ${doneCount} to ${doneCount-1}, and their notes and the comment thread on it are deleted.
       <span class="mt-2 block text-ink-3">The resource stays in the Library and can be assigned again any time.</span>`;
    document.getElementById('dConfirm').textContent = 'Unassign anyway';
  } else {
    document.getElementById('dTitle').textContent = `Unassign from ${MEMBER}`;
    document.getElementById('dBody').innerHTML =
      `Take <span class="font-medium text-ink">&ldquo;${t.title}&rdquo;</span> off ${MEMBER}&rsquo;s plate?
       <span class="mt-2 block">It stays in the Library, so it can be assigned again any time — to them or anyone else.</span>
       <span class="mt-2 block text-ink-3">${t.note?`${MEMBER}&rsquo;s notes and the comment thread on it are deleted.`:'Any comments on it are deleted.'}</span>`;
    document.getElementById('dConfirm').textContent = 'Unassign';
  }
}
function closeDialog(){ const s=document.getElementById('scrim'); s.classList.add('hidden'); s.classList.remove('grid'); }

function doRemove(){
  const id=pendingId; closeDialog();
  const t=tasks.find(x=>x.id===id);
  // 1. collapse the row in place (no re-render, so the transition has a start value)
  const w=document.querySelector(`[data-row-wrap="${id}"]`);
  if(w){
    w.style.display='grid'; w.style.gridTemplateRows='1fr';
    w.style.transition='grid-template-rows 220ms ease-in-out, opacity 220ms ease-in-out';
    requestAnimationFrame(()=>{ w.style.gridTemplateRows='0fr'; w.style.opacity='0'; });
  }
  // 2. swap the pane immediately; the incoming state fades in
  if(selectedId===id){ selectedId=null; notice=t.title; document.getElementById('pane').innerHTML=paneHTML(); }
  setTimeout(()=>{
    tasks = tasks.filter(x=>x.id!==id);
    removingId=null;
    render();
    setTimeout(()=>{ notice=null; render(); }, 4200);
  }, 220);
}

// ---- deterministic frames for screenshots ----
function setFrame(f){
  document.getElementById('frameLabel').textContent = 'frame: '+f;
  tasks = JSON.parse(JSON.stringify(BASE));
  selectedId='t1'; removingId=null; notice=null; forceHoverRow=null; forceHoverBtn=null; closeDialog();
  if(f==='rowhover'){ forceHoverRow='t2'; }
  if(f==='btnhover'){ forceHoverRow='t2'; forceHoverBtn='t2'; }
  if(f==='paneHover'){ forceHoverBtn='pane'; }
  if(f==='removing'){ removingId='t1'; }
  if(f==='notice'){ tasks=tasks.filter(x=>x.id!=='t1'); selectedId=null; notice='Alex Hormozi — $100M Offers (playlist)'; }
  if(f==='emptyNone'){ tasks=[]; selectedId=null; }
  if(f==='emptyUnselected'){ selectedId=null; }
  render();
  if(f==='confirmActive') openDialog('t2');
  if(f==='confirmDone') openDialog('d1');
}
const BASE = JSON.parse(JSON.stringify(tasks));
render();
</script>
